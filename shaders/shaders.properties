# =====================================================================
#  Redrock Visuals - shader western para Iris (Minecraft 1.21.1)
# =====================================================================

clouds=off
oldLighting=false
oldHandLight=false
underwaterOverlay=false
vignette=false
sun=false
moon=true
separateAo=false
dynamicHandLight=true
frustum.culling=true
rain.depth=false
beacon.beam.depth=true

shadowTerrain=true
shadowTranslucent=false
shadowEntities=true
shadowBlockEntities=true
shadowPlayer=true

# Texturas de ruido propias
texture.gbuffers.noisetex=tex/noise.png
texture.composite.noisetex=tex/noise.png

# Funciones de Iris que usamos si estan disponibles (si no, se usa SSR)
iris.features.optional=CUSTOM_IMAGES

# Reflejos reales: rejilla de voxeles 256x128x256 (32 MB de VRAM, solo si se activan)
#ifdef VOXEL_REFLECTIONS
image.voxelImg=voxelSampler RED_INTEGER R32UI UNSIGNED_INT true false 256 128 256
#endif

# Programas que se pueden apagar desde el menu
program.shadow.enabled=SHADOWS
program.composite.enabled=VOLUMETRIC_FOG || VOLUMETRIC_CLOUDS

# ---------------------------------------------------------------------
#  Perfiles
# ---------------------------------------------------------------------
profile.LOW=!VOXEL_REFLECTIONS shadowMapResolution:1024 shadowDistance:64.0 SHADOW_FILTER:0 VL_STEPS:6 VL_RES:0.25 CLOUD_STEPS:8 CLOUD_LIGHT_STEPS:1 !SSR SSR_STEPS:8 !CLOUD_SHADOWS !DUST_NOISE
profile.MEDIUM=!VOXEL_REFLECTIONS shadowMapResolution:1536 shadowDistance:96.0 SHADOW_FILTER:1 VL_STEPS:8 VL_RES:0.5 CLOUD_STEPS:10 CLOUD_LIGHT_STEPS:2 SSR SSR_STEPS:12 CLOUD_SHADOWS DUST_NOISE
profile.HIGH=!VOXEL_REFLECTIONS shadowMapResolution:2048 shadowDistance:128.0 SHADOW_FILTER:2 VL_STEPS:12 VL_RES:0.5 CLOUD_STEPS:16 CLOUD_LIGHT_STEPS:3 SSR SSR_STEPS:20 CLOUD_SHADOWS DUST_NOISE
profile.ULTRA=VOXEL_REFLECTIONS VOXEL_STEPS:128 SHADOWS shadowMapResolution:3072 shadowDistance:160.0 SHADOW_FILTER:2 VL_STEPS:16 VL_RES:1.0 CLOUD_STEPS:24 CLOUD_LIGHT_STEPS:4 SSR SSR_STEPS:32 CLOUD_SHADOWS DUST_NOISE

# ---------------------------------------------------------------------
#  Menu
# ---------------------------------------------------------------------
screen=<profile> <empty> [SHADOWS_SCREEN] [LIGHTING_SCREEN] [ATMOSPHERE_SCREEN] [CLOUDS_SCREEN] [WATER_SCREEN] [WAVING_SCREEN] [POST_SCREEN]
screen.columns=2

screen.SHADOWS_SCREEN=SHADOWS SHADOW_FILTER shadowMapResolution shadowDistance sunPathRotation CLOUD_SHADOWS
screen.LIGHTING_SCREEN=SUN_INTENSITY MOON_INTENSITY AMBIENT_INTENSITY BLOCKLIGHT_INTENSITY MIN_LIGHT EMISSIVE_STRENGTH HANDHELD_LIGHT
screen.ATMOSPHERE_SCREEN=VOLUMETRIC_FOG VL_INTENSITY VL_STEPS VL_RES FOG_DENSITY FOG_HEIGHT FOG_FALLOFF MORNING_FOG DUST_NOISE BORDER_FOG
screen.CLOUDS_SCREEN=VOLUMETRIC_CLOUDS CLOUD_STEPS CLOUD_LIGHT_STEPS CLOUD_HEIGHT CLOUD_THICKNESS CLOUD_COVERAGE CLOUD_DENSITY CLOUD_SPEED CLOUD_FAR
screen.WATER_SCREEN=VOXEL_REFLECTIONS VOXEL_STEPS SSR SSR_STEPS WATER_ALPHA WATER_FOG_DENSITY WAVE_STRENGTH WAVE_SPEED REFRACTION_STRENGTH
screen.WAVING_SCREEN=WAVING_PLANTS WAVING_LEAVES WAVING_WATER WAVING_LAVA WAVING_STRENGTH WAVING_SPEED WAVING_WATER_HEIGHT WAVING_LAVA_HEIGHT
screen.POST_SCREEN=EXPOSURE WESTERN_GRADE SATURATION CONTRAST VIGNETTE <empty> BLOOM BLOOM_STRENGTH

sliders=VOXEL_STEPS shadowMapResolution shadowDistance sunPathRotation SUN_INTENSITY MOON_INTENSITY AMBIENT_INTENSITY BLOCKLIGHT_INTENSITY MIN_LIGHT EMISSIVE_STRENGTH WAVING_SPEED WAVING_STRENGTH WAVING_WATER_HEIGHT WAVING_LAVA_HEIGHT VL_STEPS FOG_DENSITY FOG_HEIGHT FOG_FALLOFF VL_INTENSITY CLOUD_STEPS CLOUD_LIGHT_STEPS CLOUD_HEIGHT CLOUD_THICKNESS CLOUD_COVERAGE CLOUD_DENSITY CLOUD_SPEED CLOUD_FAR SSR_STEPS WATER_ALPHA WATER_FOG_DENSITY WAVE_STRENGTH WAVE_SPEED REFRACTION_STRENGTH EXPOSURE BLOOM_STRENGTH WESTERN_GRADE SATURATION CONTRAST VIGNETTE
